<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reservations | FlavorHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body><header id="site-header"></header><main>
<section class="page-hero"><span class="eyebrow">TABLE BOOKING</span><h1>Reserve Your Table</h1><p>Plan your next meal with us.</p></section>
<section class="section two-column"><div class="form-card"><h2>Reservation Details</h2><form id="reservation-form"><div class="form-grid">
<label>Name<input class="input" name="name" required></label><label>Email<input class="input" type="email" name="email" required></label>
<label>Phone<input class="input" type="tel" name="phone" required></label><label>Guests<select class="input" name="party_size" required><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7+</option></select></label>
<label>Date<input class="input" type="date" name="date" required></label><label>Time<input class="input" type="time" name="time" required></label></div>
<label>Special Requests<textarea class="input" name="special_requests" rows="4" placeholder="Window seat, birthday, dietary request..."></textarea></label>
<button class="btn btn-primary" type="submit">Confirm Reservation</button></form><div id="reservation-message"></div></div>
<div class="side-panel"><h3>Opening Hours</h3><p>Mon – Thu <b>11:00 AM – 10:00 PM</b></p><p>Fri – Sat <b>11:00 AM – 11:00 PM</b></p><p>Sunday <b>12:00 PM – 9:00 PM</b></p><hr><h3>Good to know</h3><p>Reservations are held for 15 minutes. Please call us if your party is delayed.</p></div></section>
</main><footer id="site-footer"></footer><script src="js/data.js"></script><script src="js/script.js"></script><script src="js/reservation.js"></script></body></html>
